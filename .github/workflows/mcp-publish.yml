name: mcp-publish

# Publishes @yusufkaracaburun/ai-kit-mcp to npm when a release tag is pushed.
# The tag push IS the manual gate — bin/release.sh creates the tag locally and
# deliberately does not push, so publishing stays a maintainer decision.
#
# Auth: npm OIDC trusted publishing (no NPM_TOKEN secret). One-time setup on
# npmjs.com → package → Settings → Trusted Publisher:
#   Publisher = GitHub Actions, repo = yusufkaracaburun/ai-kit,
#   workflow filename = mcp-publish.yml, allowed action = npm publish.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: publish ai-kit-mcp to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for npm OIDC trusted publishing
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Guard — package version matches the release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::mcp/package.json version ($PKG_VERSION) != tag ($TAG_VERSION) — run bin/sync-plugin-version.sh"
            exit 1
          fi
          echo "version $PKG_VERSION matches tag $GITHUB_REF_NAME"

      - name: Publish to npm
        # OIDC auth is detected automatically — no token. prepublishOnly runs
        # clean + build + test first; publishConfig.access=public keeps the
        # scoped package public. Trusted publishing adds provenance for free.
        run: npm publish
        env:
          AI_KIT_ROOT: ${{ github.workspace }}
