name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash version
        run: bash --version
      - name: Run script tests
        run: ./tests/bin/run-tests.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./bin
          additional_files: tests/bin/run-tests.sh
      - name: yamllint workflows
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .github/workflows/
