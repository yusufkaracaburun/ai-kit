name: mcp-server

on:
  push:
    branches: [master]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'

jobs:
  build-and-test:
    name: build + handshake test (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc)
        run: npm run build
      - name: Run handshake tests
        run: npm test
        env:
          AI_KIT_ROOT: ${{ github.workspace }}
